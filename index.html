<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FootyHubTV — The Future of Football Commentary</title>
    <meta name="description" content="FootyHubTV is redefining live football commentary. Something big is coming.">
    <meta property="og:title" content="FootyHubTV — Coming Soon">
    <meta property="og:description" content="The future of football commentary is almost here.">
    <meta property="og:image" content="logo.png">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(120, 50, 200, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(150, 50, 255, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(100, 30, 180, 0.12) 0%, transparent 40%);
            z-index: 0;
            animation: bgPulse 8s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            max-width: 800px;
        }

        .logo-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 2.5rem;
            animation: logoIn 1.5s ease-out;
        }

        .logo-wrapper::before {
            content: '';
            position: absolute;
            inset: -30%;
            background: radial-gradient(ellipse at center, rgba(120, 50, 220, 0.35) 0%, rgba(100, 30, 200, 0.15) 30%, transparent 65%);
            z-index: -1;
            border-radius: 50%;
            filter: blur(40px);
        }

        .logo {
            width: min(90vw, 550px);
            height: auto;
            filter: drop-shadow(0 0 60px rgba(140, 60, 255, 0.5)) drop-shadow(0 0 120px rgba(120, 40, 220, 0.3));
            mask-image: radial-gradient(ellipse 70% 65% at center, black 30%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse 70% 65% at center, black 30%, transparent 75%);
        }

        @keyframes logoIn {
            0% { opacity: 0; transform: scale(0.8) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .tagline {
            font-size: clamp(1.1rem, 3vw, 1.6rem);
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 1rem;
            animation: fadeUp 1.5s ease-out 0.3s both;
        }

        .subtext {
            font-size: clamp(0.9rem, 2vw, 1.05rem);
            color: rgba(255, 255, 255, 0.45);
            font-weight: 300;
            margin-bottom: 3rem;
            animation: fadeUp 1.5s ease-out 0.6s both;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .coming-soon {
            display: inline-block;
            font-size: clamp(0.75rem, 1.8vw, 0.9rem);
            letter-spacing: 0.35em;
            text-transform: uppercase;
            padding: 0.8rem 2.5rem;
            border: 1px solid rgba(150, 70, 255, 0.5);
            border-radius: 50px;
            color: rgba(200, 170, 255, 0.9);
            background: rgba(150, 70, 255, 0.08);
            animation: fadeUp 1.5s ease-out 0.9s both;
            position: relative;
            overflow: hidden;
        }

        .coming-soon::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(150, 70, 255, 0.15), transparent);
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .contact {
            margin-top: 3rem;
            animation: fadeUp 1.5s ease-out 1.2s both;
        }

        .contact a {
            color: rgba(200, 170, 255, 0.6);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            transition: color 0.3s;
        }

        .contact a:hover {
            color: rgba(200, 170, 255, 1);
        }

        /* Floating particles */
        .particles {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(150, 100, 255, 0.4);
            border-radius: 50%;
            animation: float linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="logo-wrapper">
            <img src="logo.png" alt="FootyHubTV" class="logo">
        </div>
        <div class="tagline">The Future of Football Commentary</div>
        <div class="subtext">A new era in sports broadcasting is almost here</div>
        <div class="coming-soon">Coming Soon</div>
        <div class="contact">
            <a href="mailto:contact@footyhub.tv">contact@footyhub.tv</a>
        </div>
    </div>

    <script>
        const container = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (8 + Math.random() * 12) + 's';
            p.style.animationDelay = (Math.random() * 10) + 's';
            p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
            container.appendChild(p);
        }
    </script>
</body>
</html>
