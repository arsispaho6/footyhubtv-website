name: pages-watchdog

# GitHub Pages' built-in "pages build and deployment" fails transiently on its
# "Deploy to GitHub Pages" step (observed ~every other push on 2026-07-03, build
# always green). Until GitHub fixes it, this watchdog checks every 10 minutes:
# if the latest Pages run for the CURRENT HEAD failed and no newer success
# exists, it pushes one empty commit to retrigger the deploy.
# Loop guard: gives up after 3 consecutive retry commits (real outage — stop).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: pages-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Retry failed Pages deploy for HEAD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          RUNS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=10")
          # newest Pages run for this exact commit
          STATE=$(echo "$RUNS" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for r in d.get('workflow_runs',[]):
              if r.get('name')=='pages build and deployment' and r.get('head_sha')=='$HEAD_SHA':
                  print((r.get('status') or '')+':'+(r.get('conclusion') or '')); break
          else: print('none')")
          echo "pages run for HEAD: $STATE"
          if [ "$STATE" != "completed:failure" ]; then
            echo "nothing to do"; exit 0
          fi
          # loop guard: stop after 3 consecutive retry commits
          RETRIES=$(git log -3 --format=%s | grep -c "retry Pages deploy" || true)
          if [ "$RETRIES" -ge 3 ]; then
            echo "3 consecutive retries failed — likely a real GitHub Pages outage, giving up"; exit 0
          fi
          git config user.name footyhub-bot
          git config user.email bot@footyhub.tv
          git commit --allow-empty -m "chore: retry Pages deploy (watchdog: previous deploy failed)"
          git push
          echo "retriggered Pages deploy"
